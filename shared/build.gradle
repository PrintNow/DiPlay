plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 19
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-19'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // NDK r25 is the final release whose sysroot and toolchain support KitKat.
    // Newer NDKs silently promote android-19 to android-21, producing JNI libraries
    // that are neither supported nor tested for the API 19 dynamic linker/runtime.
    ndkVersion = '25.2.9519653'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.bouncycastle
    implementation libs.conscrypt
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}

tasks.withType(Test).configureEach {
    // Conscrypt is bundled for Android 4.4 TLS 1.2; its AAR has no host library for Robolectric.
    systemProperty 'robolectric.conscryptMode', 'OFF'
}
